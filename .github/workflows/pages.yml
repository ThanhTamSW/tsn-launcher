name: pages

# Publishes the launcher site to GitHub Pages.
#
# The site must never publish on a red test suite, and it must be built by the
# tested tool (`npm run pages:build`) rather than copied by hand, so a broken
# launcher or icon fails here instead of on a phone home screen.
#
# REQUIRED ONE-TIME SETUP
# Pages must be switched on by a maintainer before this workflow can deploy:
#   https://github.com/ThanhTamSW/tsn-launcher/settings/pages
#   -> Source: "GitHub Actions"
# The GITHUB_TOKEN cannot create the Pages site itself (the API answers
# "Resource not accessible by integration"), so the configure-pages
# auto-create option is deliberately not set: it only replaces that clear
# cause with a confusing failure on every run.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build site
        run: npm run pages:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
